<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Prathmesh Chaure - VLSI, Embedded Systems, AI/ML" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07070d"/><stop offset="1" stop-color="#0d0b1f"/></linearGradient>
    <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#7c5cff"/><stop offset="1" stop-color="#00e5ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7c5cff" stroke-opacity=".10"/></pattern>
    <radialGradient id="g1" cx=".15" cy=".2" r=".6"><stop offset="0" stop-color="#7c5cff" stop-opacity=".35"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx=".9" cy=".9" r=".6"><stop offset="0" stop-color="#00e5ff" stop-opacity=".25"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <style>
      .t{stroke:#7c5cff;fill:none;stroke-width:1.6;stroke-dasharray:6 10;animation:f 2.2s linear infinite}
      .t2{stroke:#00e5ff;animation-duration:3s}
      @keyframes f{to{stroke-dashoffset:-32}}
      .pin{fill:#00e5ff}
      .m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace}
      .cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
      .fl{animation:fy 5s ease-in-out infinite}@keyframes fy{50%{transform:translateY(-6px)}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#g1)"/><rect width="1200" height="320" rx="18" fill="url(#g2)"/>
  <!-- faint chip on the right, background only -->
  <g opacity=".5" class="fl">
    <rect x="860" y="70" width="190" height="190" rx="16" fill="none" stroke="#00e5ff" stroke-opacity=".5" stroke-width="2"/>
    <rect x="905" y="115" width="100" height="100" rx="8" fill="#7c5cff" fill-opacity=".12" stroke="#7c5cff" stroke-opacity=".6"/>
    <text x="955" y="177" text-anchor="middle" class="m" font-size="34" font-weight="700" fill="#f1f1f8" fill-opacity=".55">PC</text>
    <g class="t"><path d="M890 70V30"/><path d="M920 70V10"/><path d="M955 70V36"/><path d="M990 70V14"/><path d="M1020 70V34"/>
    <path d="M890 260V300"/><path d="M920 260V312"/><path d="M955 260V290"/><path d="M990 260V308"/><path d="M1020 260V286"/>
    <path d="M860 100H820"/><path d="M860 140H800"/><path d="M860 180H830"/><path d="M860 220H806"/>
    <path d="M1050 100H1090"/><path d="M1050 140H1110"/><path d="M1050 180H1080"/><path d="M1050 220H1104"/></g>
  </g>
  <!-- left traces -->
  <g><path class="t t2" d="M0 292H120V262H260"/><path class="t" d="M0 30H90V58H200"/><path class="t t2" d="M1200 292H1130V262"/></g>
  <circle class="pin" cx="260" cy="262" r="3.5"/><circle class="pin" cx="200" cy="58" r="3.5"/>
  <!-- text -->
  <text x="70" y="132" class="m" font-size="18" fill="#00e5ff" letter-spacing="6">&gt; HELLO, WORLD. I'M</text>
  <text x="66" y="206" class="m" font-size="70" font-weight="700" fill="url(#tx)">PRATHMESH CHAURE</text>
  <text x="70" y="256" class="m" font-size="22" fill="#8b8ba3" letter-spacing="3">VLSI  •  EMBEDDED SYSTEMS  •  AI/ML</text><rect class="cur" x="582" y="238" width="3" height="22" fill="#00e5ff"/>
</svg>
